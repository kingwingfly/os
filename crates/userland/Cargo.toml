[package]
name = "os-userland"
version = "0.1.0"
edition = "2024"

[dependencies]
serde.workspace = true
serde_json.workspace = true
abi = { package = "os-abi", path = "../abi" }
os-core = { path = "../core" }
regex = { version = "1.13", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

[dev-dependencies]
kernel = { package = "os-kernel", path = "../kernel" }
