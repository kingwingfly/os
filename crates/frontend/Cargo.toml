[package]
name = "os-ui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "=0.8.23", features = ["csr"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "=0.4.80"
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "CssStyleDeclaration",
    "CustomEvent",
    "Document",
    "DomRect",
    "DomRectReadOnly",
    "Element",
    "Event",
    "HtmlElement",
    "HtmlInputElement",
    "InputEvent",
    "ClipboardEvent",
    "DataTransfer",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "MutationObserver",
    "MutationObserverInit",
    "MutationRecord",
    "Node",
    "NodeList",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Selection",
    "Storage",
    "UrlSearchParams",
    "VisualViewport",
    "Window",
] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
os-core = { path = "../core" }
abi = { package = "os-abi", path = "../abi" }
console_error_panic_hook = "0.1"
# Uploads hash files, to resume them and so that R2 checks every chunk.
sha2 = "0.11"
