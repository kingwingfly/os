[package]
name = "terminal-worker-utilities"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "utilities"
path = "src/main.rs"

[dependencies]
abi = { package = "terminal-worker-abi", path = "../abi" }
terminal-worker-posix = { path = "../posix" }
terminal-worker-core = { path = "../core" }
terminal-worker-userland = { path = "../userland" }
serde_json.workspace = true
futures = { version = "0.3", features = ["executor"] }
