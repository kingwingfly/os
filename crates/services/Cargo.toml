[package]
name = "os-services"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "supervise"
path = "src/main.rs"

[[bin]]
name = "init"
path = "src/init.rs"

[[bin]]
name = "early_init"
path = "src/bin/early_init.rs"

[[bin]]
name = "mountd"
path = "src/bin/mountd.rs"

[[bin]]
name = "exportd"
path = "src/bin/exportd.rs"

[dependencies]
abi = { package = "os-abi", path = "../abi" }
os-core = { path = "../core" }
os-posix = { path = "../posix" }
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "compositor"
path = "src/bin/compositor.rs"

[[bin]]
name = "gui-sample-doc"
path = "src/bin/gui_sample_doc.rs"

[[bin]]
name = "gui-sample-pixel"
path = "src/bin/gui_sample_pixel.rs"
