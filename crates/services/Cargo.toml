[package]
name = "os-services"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "supervise"
path = "src/main.rs"

[[bin]]
name = "init"
path = "src/init.rs"

[[bin]]
name = "early_init"
path = "src/bin/early_init.rs"

[[bin]]
name = "mountd"
path = "src/bin/mountd.rs"

[[bin]]
name = "exportd"
path = "src/bin/exportd.rs"

[dependencies]
abi = { package = "os-abi", path = "../abi" }
ammonia = "4.2"
csv = "1.4"
os-core = { path = "../core" }
os-posix = { path = "../posix" }
os-preview = { path = "../preview" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "compositor"
path = "src/bin/compositor.rs"

[[bin]]
name = "desktop-shell"
path = "src/bin/desktop_shell.rs"

[[bin]]
name = "greeter"
path = "src/bin/greeter.rs"

[[bin]]
name = "gui-sample-doc"
path = "src/bin/gui_sample_doc.rs"

[[bin]]
name = "gui-sample-pixel"
path = "src/bin/gui_sample_pixel.rs"

[[bin]]
name = "osh"
path = "src/bin/osh.rs"

[[bin]]
name = "terminal"
path = "src/bin/terminal.rs"

[[bin]]
name = "kubelet"
path = "src/bin/kubelet.rs"

[[bin]]
name = "netd"
path = "src/bin/netd.rs"

[[bin]]
name = "files"
path = "src/bin/files.rs"

[[bin]]
name = "mounts"
path = "src/bin/mounts.rs"

[[bin]]
name = "settings"
path = "src/bin/settings.rs"

[[bin]]
name = "editor"
path = "src/bin/editor.rs"

[[bin]]
name = "preview"
path = "src/bin/preview.rs"
