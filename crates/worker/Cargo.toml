[package]
name = "os"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "=0.9.0"
serde.workspace = true
serde_json.workspace = true
os-core = { path = "../core" }
os-image = { path = "../image" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The system-call interface, and the kernel's file system (owner's design, 2026-10-29).
abi = { package = "os-abi", path = "../abi" }
kernel = { package = "os-kernel", path = "../kernel" }
# getfattr -m patterns, with the regular expressions fd takes.
regex = { version = "1.13", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
wasm-bindgen.workspace = true
js-sys.workspace = true

os-vfs = { path = "../vfs" }
