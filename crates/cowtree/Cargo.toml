[package]
name = "os-cowtree"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
# Test-only in-memory HeadStore / PackStore (contract §2.15: never enabled in production builds).
test-store = []

[dependencies]
abi = { package = "os-abi", path = "../abi" }
vfs = { package = "os-vfs", path = "../vfs" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
