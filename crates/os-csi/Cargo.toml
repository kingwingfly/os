[package]
name = "os-csi"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "os_csi"
path = "src/lib.rs"

[[bin]]
name = "os-csi"
path = "src/main.rs"

[dependencies]
abi = { package = "os-abi", path = "../abi" }
base64 = "0.23"
cowtree = { package = "os-cowtree", path = "../cowtree" }
libc = "0.2"
os-cluster-state = { path = "../cluster-state" }
os-core = { path = "../core" }
os-cowfs = { path = "../cowfs" }
os-nbd = { path = "../os-nbd" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "signal", "macros"] }
vfs = { package = "os-vfs", path = "../vfs" }

[dev-dependencies]
cowtree = { package = "os-cowtree", path = "../cowtree", features = ["test-store"] }
