[package]
name = "os-client-kernel"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abi = { package = "os-abi", path = "../abi" }
cowfs = { package = "os-cowfs", path = "../cowfs" }
cowtree = { package = "os-cowtree", path = "../cowtree" }
image = { package = "os-image", path = "../image" }
kernel = { package = "os-kernel", path = "../kernel" }
os-core = { path = "../core" }
vfs = { package = "os-vfs", path = "../vfs" }
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"
js-sys.workspace = true
