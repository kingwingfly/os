[[observation]]
id = "process/startup"
permanent = "runtime observation (no portable headless Linux PID 1 comparison)"
reason = "Local Stage 2 PID 1 /usr/bin/init runs on the instance's os-cowfs root with reaper running, init and login owned by the current host, and a real managed /usr/bin/supervise process with PID 1 as parent; native Linux host PID 1 details stay in linux-evidence.json."
signature = "5b0f0fd86a3754234654c4adb843f361e421e3ef9c413a975ccdd8654197f3b4"

[[observation]]
id = "process/gui-processes"
permanent = "runtime observation (headless Linux has no matching desktop apps)"
reason = "Supervised /usr/bin/compositor, /usr/bin/desktop-shell, and all five native GUI client processes (terminal+osh, files, mounts, editor via vim, preview) appear as live OS processes in local /proc when their surfaces open; headless Linux has no matching GUI applications."
signature = "d19656535cbcfe8697a00eb1f2b3095e148b61a29c8f9167fc1726315e1b46e3"

[[observation]]
id = "process/tab-pids"
permanent = "runtime observation (headless Linux has no browser OS tabs)"
reason = "Each browser tab runs an isolated instance-owned LocalProcessTable (L3a #54): a second tab cannot observe a live sleep PID started in the first tab (other_tab_pid_visible=false). Headless Linux has no browser OS tabs."
signature = "f319a2dc65ac22a7ddeb472ba22fe194aeb2074a7c82bcd870abfb4e57fafaea"
