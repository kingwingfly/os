# Reviewed post-L6d Contract v2 conformance baseline measurements (#44).
# All 57 L0a refactor differences resolved across L1-L6d have been pruned (71/120
# filesystem rows now match Linux byte-for-byte with full (st_dev, st_ino) identity).
# Every remaining entry documents a verified permanent provider, security-confinement,
# privilege-boundary, or decoupled-identity limit per docs/architecture/contract.md.
# Process observations are stored once under process/*, independently of filesystems.
# GUI v1 G-01 through G-10 are seat protocol checks in matrix.md. Their errno
# refusals are required by the GUI contract and have no Linux filesystem waiver.

