# Reviewed L0a measurements; no architecture or permanent provider limits selected.
# [[observation]] records lack a comparable Linux fixture and detect changes, not convergence.
# Allowed owners are data in follow-up-issues.json.

[[difference]]
id = "cloud/alias"
issues = ["#51"]
reason = "No API attaches the cloud tree a second time; explicitly unavailable."
