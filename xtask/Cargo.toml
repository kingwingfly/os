[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
abi = { package = "os-abi", path = "../crates/abi" }
base64 = "0.23"
cowfs = { package = "os-cowfs", path = "../crates/cowfs" }
cowtree = { package = "os-cowtree", path = "../crates/cowtree" }
os-image = { path = "../crates/image" }
os-core = { path = "../crates/core" }
os-services = { path = "../crates/services" }
vfs = { package = "os-vfs", path = "../crates/vfs" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
