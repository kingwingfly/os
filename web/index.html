<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><meta name="color-scheme" content="dark"><meta name="description" content="A browser OS with processes, a filesystem, accounts, and applications."><title>OS</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"></head>
<body><div id="app"><p class="loading">Starting OS...</p></div><div id="dropzone" hidden>Save files to the current directory<span>Write using your current account permissions; up to 1 GB per file; interrupted uploads resume</span></div>
<div id="listening" role="region" aria-label="Live sound" hidden><span class="listening-icon" aria-hidden="true">♪</span><span id="listening-name"></span><span class="listening-state"></span><button id="listening-play">▶ Listen</button><button id="listening-mute">Mute</button><button id="listening-stop" aria-label="Stop listening">×</button></div>
<dialog id="console-share" aria-labelledby="console-share-title"><form><h2 id="console-share-title">Open command in a new window</h2><p>View live output or move keyboard control to the new window. Keep this window open; closing it ends the command.</p><label>Sharing allowed for this account <select name="sharing"><option value="control">View and keyboard control</option><option value="view">View only</option><option value="none">Disabled</option></select></label><button type="button" id="console-share-save">Save preference</button><label><input type="radio" name="access" value="view" checked> View only</label><label><input type="radio" name="access" value="control"> Use keyboard in new window</label><p id="console-share-error" role="alert"></p><div class="auth-actions"><button type="button" id="console-share-cancel">Cancel</button><button type="submit">Open window</button></div></form></dialog>
<script type="module">import { ready, started } from './bridge.js'; import init from './pkg/frontend.js'; ready.then(() => init()).then(started).catch(error => { document.getElementById('app').textContent = 'OS failed to load. Refresh to try again.'; console.error(error); });</script></body></html>
