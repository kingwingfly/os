<div id="viewer-surface">
  <div class="viewer-bar">
    <div class="viewer-heading">
      <button type="button" id="viewer-back" aria-label="Back" hidden>←</button>
      <span id="viewer-title"></span>
    </div>
    <div class="viewer-actions">
      <button type="button" id="download" aria-label="Download" hidden>Download</button>
      <button type="button" id="viewer-search" aria-label="Search the preview" title="Search · Ctrl+F" hidden>⌕</button>
      <button type="button" id="fullscreen" aria-label="Fullscreen" aria-pressed="false">⛶</button>
      <button type="button" id="close-viewer" aria-label="Close preview">Close ×</button>
    </div>
  </div>
  <div id="viewer-content"></div>
  <p id="fullscreen-error" role="status" hidden></p>
</div>
